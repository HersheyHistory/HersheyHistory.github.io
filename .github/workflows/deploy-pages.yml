name: Deploy to GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

# Let the workflow publish to Pages, but nothing else.
permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time; a newer push supersedes one still running.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      # Ask GitHub where this repository's Pages site lives, rather than
      # writing the path in: "/hershey-02" for a project site, "" for a
      # <owner>.github.io site at the root. The build then follows the
      # repository through any rename or transfer.
      - id: pages
        uses: actions/configure-pages@v5

      - name: Build for the site's address
        run: npm run build
        env:
          VITE_BASE_PATH: ${{ steps.pages.outputs.base_path }}/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
